<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dexplorer</title>
<link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head><body><div class="app">
<aside><div class="mw"><button id="mb" class="mb" aria-haspopup="menu" aria-expanded="false" aria-controls="mn">Dexplorer<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="mn" class="mn" role="menu" aria-label="Dexplorer" hidden><button role="menuitem" aria-current="page"><span>Encounter Map</span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="m3 8.5 3.2 3.2L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button role="menuitem" aria-disabled="true"><span>Pokédex</span><small>Soon</small></button></div></div><div class="sub">Find where to catch them</div><input id="q" type="search" placeholder="Search name or number" aria-label="Search Pokémon"><div class="gw"><button id="gb" class="gb" aria-haspopup="menu" aria-expanded="false" aria-controls="gm" aria-label="Generation"><span id="gbt">Generation I</span><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 1.8l3 2.7M3 7.5l3 2.7 3-2.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="gm" class="mn gm" role="menu" aria-label="Generation" hidden></div></div><div class="seg" id="seg" role="group" aria-label="Game"></div><div id="dex" role="list"></div></aside>
<main><div class="bar"><h2 id="t">Select a Pokémon</h2><div class="legend">Lowest <span class="grad"></span> Highest</div></div>
<div class="map"><svg id="m" viewBox="0 0 1130 960" role="img" aria-label="Kanto map with encounter heatmap"><defs><filter id="b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter></defs><image id="mapimg" width="1130" height="960"/><g id="heat" filter="url(#b)"></g><g id="hits"></g></svg></div>
<div class="list" id="list"></div><div class="tipbox" id="tipbox" hidden></div></main></div><div class="tip" id="tip"></div></body></html>
