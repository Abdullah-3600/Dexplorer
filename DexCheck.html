<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DexCheck · Dexplorer</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dexcheck.css"><script src="js/saves.js" defer></script><script src="js/dexcheck.js" defer></script></head><body><div class="app">
<aside><div class="mw"><button id="mb" class="mb" aria-haspopup="menu" aria-expanded="false" aria-controls="mn">DexCheck<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="mn" class="mn" role="menu" aria-label="Dexplorer" hidden><button role="menuitem" data-href="Dexplorer.html"><span>Dexplorer</span></button><button role="menuitem" aria-current="page"><span>DexCheck</span></button><button role="menuitem" aria-disabled="true"><span>Pokédex</span><small>Soon</small></button></div></div>
<div class="sub">Track your living dex</div>
<div class="side">
<section class="up" aria-labelledby="uph"><h2 id="uph" class="vh">Save files</h2>
<button id="add" class="add" type="button"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Add Save Files</span></button>
<input id="file" type="file" multiple hidden>
<p class="hint">Drop files anywhere on this page. Your saves are read on this device and never uploaded.</p>
<ul id="saves" class="saves" aria-label="Loaded saves"></ul><ul id="issues" class="issues" aria-label="Files that could not be read"></ul>
</section>
<details id="gp" class="games ls"><summary class="dis"><svg class="ficon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 6h9M16 6h1M3 14h1M8 14h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="14" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="14" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="dlab">Filters</span><small id="gsum" class="cnt act" hidden></small><i class="chv"></i></summary><div class="fp"><h3 class="gg">Sort by</h3><div id="srt" class="sg" role="group" aria-label="Sort by"><button type="button" data-v="national" aria-pressed="true">National Dex</button><button type="button" data-v="region" aria-pressed="false">Region</button><button type="button" data-v="generation" aria-pressed="false">Generation</button></div><h3 class="gg">Games</h3><div id="gl"></div><button id="gclr" class="link" type="button" hidden>Reset filters</button></div></details>
</div></aside>
<main><div class="tb"><div class="tt"><div><h1>Living Dex</h1><p id="stat" class="stat" aria-live="polite"></p></div><div class="big" aria-hidden="true"><b id="bn">0</b><span>/ 386</span></div></div>
<div class="pr" role="progressbar" aria-label="Living dex completion" aria-valuemin="0" aria-valuemax="386" aria-valuenow="0" id="pr"><i id="pf"></i></div>
<div class="ctl"><input id="q" type="search" placeholder="Search name or number" aria-label="Search Pokémon"><div class="seg" id="seg" role="group" aria-label="Show"><button type="button" data-v="all" aria-pressed="true">All</button><button type="button" data-v="caught" aria-pressed="false">Caught</button><button type="button" data-v="missing" aria-pressed="false">Missing</button></div></div></div>
<div id="grid"></div><p id="none" class="none" hidden>No Pokémon match.</p></main></div>
<dialog id="dlg" aria-labelledby="dt"><div class="dh"><div><h2 id="dt"></h2><p id="dn" class="stat"></p></div><button id="dx" class="x" type="button" aria-label="Close"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div><div id="dl"><div id="ds" class="ds"></div><h3>Caught</h3><ul id="dc" class="dc"></ul></div><div id="dv" hidden></div></dialog>
<div id="drop" class="drop" hidden><div>Drop save files to add them</div></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div></body></html>
